name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
        working-directory: packages/dashwire
      - run: dart test
        working-directory: packages/dashwire_udp
      - run: dart test
        working-directory: packages/dashwire_replication

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart compile js -o "${{ runner.temp }}/smoke.js" packages/dashwire/tool/web_smoke.dart
      - run: dart compile wasm -o "${{ runner.temp }}/smoke.wasm" packages/dashwire/tool/web_smoke.dart
      - run: dart test -p chrome
        working-directory: packages/dashwire
      - run: dart test -p chrome
        working-directory: packages/dashwire_replication
